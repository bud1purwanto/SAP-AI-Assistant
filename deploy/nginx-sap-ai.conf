# ==========================================================
# Nginx Configuration for SAP AI Assistant
# Salin file ini ke: /etc/nginx/sites-available/sap-ai
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/sap-ai /etc/nginx/sites-enabled/
# ==========================================================

# Upstream ke backend FastAPI (port 8005)
upstream sap_backend {
    server 127.0.0.1:8005;
    keepalive 32;
}

server {
    # Port default 8080 (aman jika port 80 sudah digunakan aplikasi lain seperti ABAP VCS)
    listen 8080;
    server_name sap-ai.local _;  # Ganti dengan domain/IP server Anda

    # Direktori build frontend (SPA)
    root /opt/sap-ai-assistant/frontend/dist;
    index index.html;

    # Gzip Compression untuk performa maksimal
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Proxy ke FastAPI Backend
    location /api {
        proxy_pass http://sap_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang untuk LLM inference
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering untuk respons cepat/streaming
        proxy_buffering off;
    }

    # Static Assets Caching (Vite build files)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page App (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logging
    access_log /var/log/nginx/sap-ai-access.log;
    error_log /var/log/nginx/sap-ai-error.log;
}
