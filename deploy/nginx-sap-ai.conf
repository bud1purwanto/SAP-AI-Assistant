# ==========================================================
# Nginx Configuration for SAP AI Assistant
# Salin file ini ke: /etc/nginx/sites-available/sap-ai
# Aktifkan dengan: sudo ln -sf /etc/nginx/sites-available/sap-ai /etc/nginx/sites-enabled/
# ==========================================================

# Upstream ke backend FastAPI (port 8005)
upstream sap_backend {
    server 127.0.0.1:8005;
    keepalive 32;
}

server {
    # Port default 8080 (aman jika port 80 sudah digunakan aplikasi lain seperti ABAP VCS)
    listen 8080;
    server_name sap-ai.local _;  # Ganti dengan domain/IP server Anda

    # Direktori build frontend (SPA) di server Linux
    root /var/www/SAP-AI-Assistant/frontend/dist;
    index index.html;

    # Gzip Compression untuk performa maksimal
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Proxy ke FastAPI Backend
    location /api {
        # Unggahan lampiran: batas bawaan Nginx 1 MB menolak berkas lebih besar
        # dengan 413 sebelum permintaan sampai ke backend. Nilai ini harus lebih
        # besar dari batas aplikasi (10 MB dokumen / 5 MB gambar).
        client_max_body_size 12M;

        proxy_pass http://sap_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang untuk LLM inference & MCP tools
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering dimatikan agar respons streaming (progres jawaban AI lewat
        # Server-Sent Events) sampai ke browser seketika, bukan menumpuk dulu.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 1. PWA Service Worker & Manifest: JANGAN DI-CACHE!
    # File ini harus selalu diperiksa ke server agar update aplikasi seketika terdeteksi oleh browser & CDN (Cloudflare).
    location ~* ^/(?:sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[a-f0-9]+\.js)$ {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 2. Vite Build Assets (dist/assets): Memiliki content hash unik (misal index-BQq88UTA.js)
    # Sangat aman di-cache 1 tahun (immutable) karena nama file berganti otomatis setiap kali rebuild.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 3. Static Media / Font di root publik
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 4. Entry point SPA index.html: WAJIB NO-CACHE
    # Agar browser selalu memuat file HTML terbaru yang merujuk ke chunk JS/CSS terkini.
    location = /index.html {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 5. Frontend Single Page App (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Logging
    access_log /var/log/nginx/sap-ai-access.log;
    error_log /var/log/nginx/sap-ai-error.log;
}