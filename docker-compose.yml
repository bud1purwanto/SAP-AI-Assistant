# ==============================================================================
# Docker Compose: Enterprise AI Assistant (Full Stack & Local Dev)
# ==============================================================================
#
# Penggunaan:
#   1. Jalankan hanya Database (untuk dev backend di host):
#      docker compose up -d postgres
#
#   2. Jalankan Seluruh Stack (Postgres + Backend + Frontend):
#      docker compose up -d --build
#
# ==============================================================================

services:
  postgres:
    image: postgres:16
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ABAP_DB
    ports:
      - "5432:5432"
    volumes:
      - enterprise-ai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ABAP_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - enterprise-ai-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise-ai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8006}:8005"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enterprise-ai-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8086}:80"
    depends_on:
      - backend
    networks:
      - enterprise-ai-net

networks:
  enterprise-ai-net:
    driver: bridge
    name: enterprise-ai-net

volumes:
  enterprise-ai-pgdata:
