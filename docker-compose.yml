name: ai-assistant

# PostgreSQL untuk pengembangan lokal.
#
# Aplikasi ini hanya berjalan di atas PostgreSQL — dukungan SQLite sudah
# dihapus — sehingga database harus tersedia sebelum backend dinyalakan.
#
#   docker compose up -d
#   cd backend && uvicorn main:app --reload
#
services:
  # postgres:
  #   image: postgres:16
  #   container_name: sap-ai-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: ABAP_DB
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - sap-ai-pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d ABAP_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  backend:
    build: ./backend
    container_name: ai-assistant-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DASHBOARD_MCP_URL: ${DASHBOARD_MCP_URL:-http://192.168.1.161:4000}
      DASHBOARD_MCP_API_TOKEN: ${DASHBOARD_MCP_API_TOKEN:?DASHBOARD_MCP_API_TOKEN must be set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8006:8000"
    networks:
      - default
      - ai-workspace

  frontend:
    build: ./frontend
    container_name: ai-assistant-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  sap-ai-pgdata:

networks:
  ai-workspace:
    external: true
    name: ${AGENTIC_TOOLS_BACKEND_NETWORK:-ai-workspace_ai-workspace}
