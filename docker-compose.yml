name: ai-assistant

# PostgreSQL untuk pengembangan lokal.
#
# Penggunaan:
#   1. Jalankan hanya Database (untuk dev backend di host):
#      docker compose up -d postgres
#
#   2. Jalankan Seluruh Stack (Postgres + Backend + Frontend):
#      docker compose up -d --build
#
# ==============================================================================

services:
  # postgres:
  #   image: postgres:16
  #   container_name: sap-ai-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: ABAP_DB
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - sap-ai-pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d ABAP_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  backend:
    build: ./backend
    container_name: ai-assistant-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8006:8000"
    networks:
      - default
      - ai-workspace

  frontend:
    build: ./frontend
    container_name: ai-assistant-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:80"
    depends_on:
      - backend

volumes:
  sap-ai-pgdata:

networks:
  ai-workspace:
    external: true
    name: ${AGENTIC_TOOLS_BACKEND_NETWORK:-ai-workspace_ai-workspace}
