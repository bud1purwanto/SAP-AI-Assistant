# PostgreSQL untuk pengembangan lokal.
#
# Aplikasi ini hanya berjalan di atas PostgreSQL — dukungan SQLite sudah
# dihapus — sehingga database harus tersedia sebelum backend dinyalakan.
#
#   docker compose up -d
#   cd backend && uvicorn main:app --reload
#
services:
  postgres:
    image: postgres:16
    container_name: sap-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ABAP_DB
    ports:
      - "5432:5432"
    volumes:
      - sap-ai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ABAP_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sap-ai-pgdata:
