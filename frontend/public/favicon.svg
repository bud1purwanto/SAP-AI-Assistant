<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="sapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#aiGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main AI Spark Center -->
  <path d="M64 24 C64 46 46 64 24 64 C46 64 64 82 64 104 C64 82 82 64 104 64 C82 64 64 46 64 24 Z" fill="url(#aiGrad)" filter="url(#glow)"/>
  
  <!-- Mini Secondary Spark -->
  <path d="M92 28 C92 36 84 42 76 42 C84 42 92 48 92 56 C92 48 100 42 108 42 C100 42 92 36 92 28 Z" fill="#60A5FA" opacity="0.9"/>
  
  <!-- Center Core Node -->
  <circle cx="64" cy="64" r="7" fill="#FFFFFF"/>
</svg>