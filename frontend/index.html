    <script>
      // Terapkan tema dan deteksi mode PWA sebelum React dimuat agar tidak terjadi kedipan warna/layout.
      (function () {
        try {
          var root = document.documentElement;
          var isStandalone = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
          if (isStandalone) {
            root.classList.add('is-pwa-standalone');
          }
          // Tinggi viewport nyata. Di PWA standalone iOS, 100dvh bisa menyisakan
          // celah kosong di bawah karena area home-indicator ikut terhitung;
          // visualViewport memberi angka yang benar-benar terlihat.
          var setAppHeight = function () {
            var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            root.style.setProperty('--app-height', h + 'px');
          };
          setAppHeight();
          window.addEventListener('resize', setAppHeight);
          window.addEventListener('orientationchange', setAppHeight);
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setAppHeight);
          }

          var t = localStorage.getItem('sap_assistant_theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          if (t === 'system') {
            root.removeAttribute('data-theme');
          } else {
            root.setAttribute('data-theme', t);
          }
          var dark = t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>

    <script>
      (function() {
        if (window.top === window.self) return;

        // 1. Sinkronisasi token/storage yang ada ke parent dashboard
        setInterval(function() {
          try {
            var payload = {};
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              payload[k] = localStorage.getItem(k);
            }
            window.top.postMessage({ type: 'SAVE_TOKENS', serviceId: 'sap-ai-assistant', payload: payload }, '*');
          } catch (e) {}
        }, 1500);

        // 2. Handler penerima pesan dari Dashboard
        window.addEventListener('message', function(e) {
          if (!e.data) return;

          // Restore session tokens
          if (e.data.type === 'RESTORE_TOKENS' && e.data.payload) {
            try {
              var p = e.data.payload;
              Object.keys(p).forEach(function(k) {
                if (!localStorage.getItem(k)) localStorage.setItem(k, p[k]);
              });
            } catch (err) {}
          }
