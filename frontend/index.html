<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Enterprise AI" />
    <meta name="application-name" content="Enterprise AI Assistant" />
    <meta name="description" content="Enterprise AI Assistant" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module">
      try {
        const { injectIntoGlobalHook } = await import('/@react-refresh');
        injectIntoGlobalHook(window);
      } catch (e) {}
    </script>
    <script>
      // Terapkan tema dan deteksi mode PWA sebelum React dimuat agar tidak terjadi kedipan warna/layout.
      (function () {
        try {
          var root = document.documentElement;
          var isStandalone = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
          if (isStandalone) {
            root.classList.add('is-pwa-standalone');
          }
          // Tinggi viewport nyata. Di PWA standalone iOS, 100dvh bisa menyisakan
          // celah kosong di bawah karena area home-indicator ikut terhitung;
          // visualViewport memberi angka yang benar-benar terlihat.
          var setAppHeight = function () {
            var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            root.style.setProperty('--app-height', h + 'px');
          };
          setAppHeight();
          window.addEventListener('resize', setAppHeight);
          window.addEventListener('orientationchange', setAppHeight);
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setAppHeight);
          }

          var t = localStorage.getItem('sap_assistant_theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          if (t === 'system') {
            root.removeAttribute('data-theme');
          } else {
            root.setAttribute('data-theme', t);
          }
          var dark = t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <title>Enterprise AI Assistant</title>
  </head>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      Token sync via postMessage (SAVE_TOKENS / RESTORE_TOKENS) and
      localStorage.setItem('sap_assistant_token', ...) were removed.
      Authentication is now handled exclusively by the Dashboard OIDC BFF
      using HTTP-only session cookies. No localStorage token is stored or
      forwarded to the parent window.
    -->
  </body>
</html>
