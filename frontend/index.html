<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Terapkan tema sebelum React dimuat agar tidak terjadi kedipan warna.
      (function () {
        try {
          var t = localStorage.getItem('sap_assistant_theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          var root = document.documentElement;
          if (t === 'system') {
            root.removeAttribute('data-theme');
          } else {
            root.setAttribute('data-theme', t);
          }
          var dark = t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <title>SAP AI Assistant | Enterprise Co-Pilot</title>
  </head>
  <body class="bg-surface text-content font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
