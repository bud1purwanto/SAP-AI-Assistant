name: Auto Deploy SAP AI Assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy on Push
    # Menggunakan label spesifik agar terisolasi dari runner project lain di server yang sama
    runs-on: [self-hosted, sap-ai]
    steps:
      - name: Deploy to /var/www/SAP-AI-Assistant
        run: |
          echo "🚀 [GitHub Runner] Memulai Auto Deployment SAP AI Assistant..."
          cd /var/www/SAP-AI-Assistant
          chmod +x deploy/update.sh
          bash deploy/update.sh
