name: Deploy SAP AI Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/SAP-AI-Assistant

permissions:
  contents: read

jobs:
  deploy:
    name: Auto Deploy to Linux Server
    runs-on: self-hosted
    steps:
      - name: Checkout kode terbaru
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
          cd "$APP_DIR"
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD
          echo "Sekarang di commit: $(git rev-parse --short HEAD)"

      - name: Build dan Restart Docker
        run: |
          cd "$APP_DIR"
          
          # Build frontend dulu (butuh node + vite via npm run build)
          cd frontend && npm ci && npm run build && cd ..

          sudo docker rm -f sap-ai-frontend sap-ai-backend 2>/dev/null || true
          
          sudo docker build -t sap-ai-backend-img:latest -f Dockerfile.backend .
          sudo docker build -t sap-ai-frontend-img:latest -f Dockerfile.frontend .
          
          sudo docker run -d \
            --name sap-ai-backend \
            --restart=unless-stopped \
            -p 8006:8005 \
            --env-file backend/.env \
            -v "$APP_DIR/backend:/app:ro" \
            sap-ai-backend-img:latest

          sudo docker run -d \
            --name sap-ai-frontend \
            --restart=unless-stopped \
            -p 8086:80 \
            --link sap-ai-backend:backend \
            sap-ai-frontend-img:latest
          
          echo "Docker Containers restarted (Zero Downtime)"

      - name: Pastikan frontend merespons
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8086 >/dev/null 2>&1; then
              echo "Frontend berjalan setelah ${i} detik."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend tidak merespons setelah 30 detik."
          sudo -n docker ps --filter name=sap-ai
          exit 1
