name: Deploy SAP AI Assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Linux Server
    runs-on: self-hosted
    steps:
      - name: Execute Update Script on Server
        run: |
          echo "🚀 [GitHub Runner] Memulai Auto Deployment SAP AI Assistant..."
          cd /var/www/SAP-AI-Assistant
          chmod +x deploy/update.sh
          bash deploy/update.sh
