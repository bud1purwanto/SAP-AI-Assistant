name: Deploy SAP AI Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to Linux Server
    # Label harus cocok dengan runner yang terdaftar. Runner server ini hanya
    # memiliki label "self-hosted"; menambahkan label lain membuat job
    # menggantung di antrean selamanya karena tidak ada runner yang cocok.
    runs-on: self-hosted
    steps:
      - name: Execute Update Script on Server
        run: |
          echo "🚀 Memulai Auto Deployment SAP AI Assistant..."
          cd /var/www/SAP-AI-Assistant
          # Tidak ada `chmod +x` di sini. Berkasnya sudah bermode 100755 di Git,
          # dan runner bukan pemiliknya sehingga chmod gagal dengan
          # "Operation not permitted". Karena shell berjalan dengan `bash -e`,
          # kegagalan itu menghentikan seluruh langkah sebelum update.sh sempat
          # jalan — inilah penyebab semua deploy gagal sejak run ke-13.
          bash deploy/update.sh

  # Pemeriksaan mutu berjalan PARALEL dan sengaja TIDAK memblokir deploy.
  #
  # Versi sebelumnya memakai `needs: verify`, sehingga satu peringatan lint
  # menahan rilis berhari-hari. Gerbang yang menghalangi setiap deploy lebih
  # merugikan daripada tidak ada gerbang. Di sini hasilnya tetap terlihat
  # (centang/silang di commit) tanpa menghentikan rilis.
  #
  # Bila nanti ingin memblokir lagi, tambahkan `needs: verify` pada job deploy.
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ABAP_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Tanpa --deny-warnings: aturan bertingkat "error" (mis. no-undef, yang
      # menangkap variabel tak terdeklarasi penyebab halaman putih) tetap
      # menggagalkan job, sementara peringatan gaya penulisan tidak.
      - name: Lint frontend
        working-directory: frontend
        run: npx oxlint src/ e2e/

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ABAP_DB
          JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          BOOTSTRAP_ADMIN_PASSWORD: AdminPass123
        run: pytest

      # Tes end-to-end menjalankan aplikasi sungguhan (backend + frontend hasil
      # build) di dalam browser. Dua bug pada fitur edit/buat-ulang pernah lolos
      # dari seluruh tes backend dan hanya terlihat di lapisan ini.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create E2E database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE sapai_e2e'

      - name: Run end-to-end tests
        env:
          E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sapai_e2e
          JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          E2E_ADMIN_PASSWORD: AdminPass123
        run: bash scripts/e2e.sh

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
