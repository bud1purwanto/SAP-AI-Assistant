name: Deploy Enterprise AI Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Auto Deploy to Linux Server
    runs-on: self-hosted
    steps:
      - name: Deteksi direktori aplikasi & Checkout kode terbaru
        run: |
          set -euo pipefail

          if [ -d "/var/www/Enterprise AI Assistant" ]; then
            TARGET_DIR="/var/www/Enterprise AI Assistant"
          elif [ -d "/var/www/Enterprise-AI-Assistant" ]; then
            TARGET_DIR="/var/www/Enterprise-AI-Assistant"
          elif [ -d "/var/www/SAP-AI-Assistant" ]; then
            TARGET_DIR="/var/www/SAP-AI-Assistant"
          else
            TARGET_DIR="/var/www/Enterprise AI Assistant"
          fi

          echo "APP_DIR=${TARGET_DIR}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${TARGET_DIR}" 2>/dev/null || true
          cd "${TARGET_DIR}"
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD
          echo "Sekarang di commit: $(git rev-parse --short HEAD)"

      - name: Build dan Restart Docker
        run: |
          cd "$APP_DIR"
          
          # Build frontend
          cd frontend
          npm install
          npm run build
          cd ..

          # Pastikan docker network tersedia
          docker network create enterprise-ai-net 2>/dev/null || true

          # Hapus container lama (baik nama baru maupun legacy)
          docker rm -f enterprise-ai-frontend enterprise-ai-backend sap-ai-frontend sap-ai-backend 2>/dev/null || true
          
          docker build -t enterprise-ai-backend-img:latest -f Dockerfile.backend .
          docker build -t enterprise-ai-frontend-img:latest -f Dockerfile.frontend .
          
          # Jalankan Backend
          ENV_FILE="$APP_DIR/backend/.env"
          if [ ! -f "$ENV_FILE" ]; then
            ENV_FILE="$APP_DIR/deploy/.env.production.example"
          fi

          docker run -d \
            --name enterprise-ai-backend \
            --network enterprise-ai-net \
            --network-alias backend \
            --add-host=host.docker.internal:host-gateway \
            --restart=unless-stopped \
            -p 8006:8005 \
            --env-file "$ENV_FILE" \
            enterprise-ai-backend-img:latest

          # Beri jeda sejenak agar backend menyelesaikan inisialisasi DB
          sleep 3

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ABAP_DB
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234
          BOOTSTRAP_ADMIN_PASSWORD: AdminPass123
        run: pytest

      # Tes end-to-end menjalankan aplikasi sungguhan (backend + frontend hasil
      # build) di dalam browser. Dua bug pada fitur edit/buat-ulang pernah lolos
      # dari seluruh tes backend dan hanya terlihat di lapisan ini.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create E2E database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE sapai_e2e'

      - name: Run end-to-end tests
        env:
          E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sapai_e2e
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234
          E2E_ADMIN_PASSWORD: AdminPass123
        run: bash scripts/e2e.sh

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
