name: Deploy Enterprise AI Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Auto Deploy to Linux Server
    runs-on: self-hosted
    steps:
      - name: Deteksi direktori aplikasi & Checkout kode terbaru
        run: |
          set -euo pipefail

          if [ -d "/var/www/Enterprise-AI-Assistant" ]; then
            TARGET_DIR="/var/www/Enterprise-AI-Assistant"
          elif [ -d "/var/www/SAP-AI-Assistant" ]; then
            TARGET_DIR="/var/www/SAP-AI-Assistant"
          else
            TARGET_DIR="/var/www/Enterprise-AI-Assistant"
          fi

          echo "APP_DIR=${TARGET_DIR}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${TARGET_DIR}" 2>/dev/null || true
          cd "${TARGET_DIR}"
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD
          echo "Sekarang di commit: $(git rev-parse --short HEAD)"

      - name: Build dan Restart Docker
        run: |
          cd "$APP_DIR"
          
          # Build frontend (butuh node + vite via npm run build)
          cd frontend && npm ci && npm run build && cd ..

          # Pastikan docker network tersedia
          sudo docker network create enterprise-ai-net 2>/dev/null || true

          # Hapus container lama (baik nama baru maupun legacy)
          sudo docker rm -f enterprise-ai-frontend enterprise-ai-backend sap-ai-frontend sap-ai-backend 2>/dev/null || true
          
          sudo docker build -t enterprise-ai-backend-img:latest -f Dockerfile.backend .
          sudo docker build -t enterprise-ai-frontend-img:latest -f Dockerfile.frontend .
          
          sudo docker run -d \
            --name enterprise-ai-backend \
            --network enterprise-ai-net \
            --network-alias backend \
            --restart=unless-stopped \
            -p 8006:8005 \
            --env-file backend/.env \
            -v "$APP_DIR/backend:/app:ro" \
            enterprise-ai-backend-img:latest

          sudo docker run -d \
            --name enterprise-ai-frontend \
            --network enterprise-ai-net \
            --restart=unless-stopped \
            -p 8086:80 \
            enterprise-ai-frontend-img:latest
          
          echo "Docker Containers restarted (Zero Downtime)"

      - name: Pastikan frontend merespons
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8086 >/dev/null 2>&1; then
              echo "Frontend berjalan setelah ${i} detik."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend tidak merespons setelah 30 detik."
          sudo -n docker ps --filter name=enterprise-ai
          exit 1
