name: Verify & Deploy SAP AI Assistant

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Gerbang verifikasi. Sebelumnya setiap push ke main langsung dideploy tanpa
  # pemeriksaan apa pun, sehingga commit yang merusak frontend (mis. variabel
  # yang tidak dideklarasikan) bisa mendarat di server sebagai halaman putih.
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ABAP_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx oxlint src/ --deny-warnings

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ABAP_DB
          JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          BOOTSTRAP_ADMIN_PASSWORD: AdminPass123
        run: pytest

  deploy:
    name: Auto Deploy on Push
    # Deploy hanya berjalan bila verifikasi lulus dan hanya untuk push ke main.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Menggunakan label spesifik agar terisolasi dari runner project lain di server yang sama
    runs-on: [self-hosted, sap-ai]
    steps:
      - name: Deploy to /var/www/SAP-AI-Assistant
        run: |
          echo "🚀 [GitHub Runner] Memulai Auto Deployment SAP AI Assistant..."
          cd /var/www/SAP-AI-Assistant
          chmod +x deploy/update.sh
          bash deploy/update.sh
