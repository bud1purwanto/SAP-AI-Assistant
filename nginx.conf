# ==========================================================
# Nginx Configuration for Enterprise AI Assistant (Docker)
# ==========================================================

server {
    listen 80;
    server_name enterprise-ai.local sap-ai.local _;

    # Dynamic Docker DNS resolver
    resolver 127.0.0.11 ipv6=off valid=5s;

    # Root frontend
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API proxy ke FastAPI backend
    location /api {
        client_max_body_size 12M;

        set $backend_target http://backend:8005;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout untuk proses LLM inference & MCP tools
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Nonaktifkan buffering untuk streaming SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 1. Service Worker: no-cache agar selalu update
    location = /sw.js {
        expires off;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    # Manifest & workbox
    location ~* ^/(?:registerSW\.js|manifest\.webmanifest|workbox-[a-f0-9]+\.js)$ {
        expires off;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    # 2. Vite Build Assets: Content hashed, aman di-cache 1 tahun
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 3. Static Media / Font
    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 4. Entry point SPA index.html: WAJIB NO-CACHE
    location = /index.html {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 5. Frontend Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}
